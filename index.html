<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Little Word Garden</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#4aa6e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Word Garden">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a2f25; --cream:#fffaf1; --orange:#e9742b; --blue:#3f8fd6; --green:#3f8445; --red:#d9452b; --gold:#ffd23f;
  --teacher-h: clamp(170px, 36vh, 330px);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#4aa6e0;color:var(--ink);
  font-family:'Baloo 2',system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#scene{position:fixed;inset:0;overflow:hidden}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;mix-blend-mode:multiply;background-image:var(--grain);z-index:20}
#decor{position:absolute;inset:0;pointer-events:none;z-index:1}
.foliage{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.foliage svg{width:100%;height:100%;display:block}
#foliageBack{height:30vh;z-index:1}
#foliageFront{height:17vh;z-index:4}

/* teacher */
#teacher{position:absolute;left:max(8px,1.5vw);bottom:1.5vh;height:var(--teacher-h);aspect-ratio:220/300;z-index:3;
  animation:float 3.2s ease-in-out infinite;cursor:pointer}
#teacher svg{width:100%;height:100%;display:block;overflow:visible}
#teacher.cheer{animation:jump .7s ease-out}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes jump{0%{transform:none}30%{transform:translateY(-34px) rotate(-4deg)}60%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
#bubble{position:absolute;left:calc(var(--teacher-h) * .62 + 1.5vw);bottom:calc(var(--teacher-h) * .72);z-index:12;
  max-width:min(60vw,400px);background:#fff;border:3px solid var(--ink);border-radius:26px;padding:10px 20px;font-size:clamp(20px,3.2vh,30px);
  font-weight:800;line-height:1.15;box-shadow:0 6px 0 rgba(74,47,37,.15);pointer-events:none;
  transform-origin:0 100%;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;opacity:0;transform:scale(.6)}
#bubble.show{opacity:1;transform:scale(1)}
#bubble::after{content:"";position:absolute;left:-15px;bottom:14px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}

/* shared look: picture-book card (paper, ink outline, slight tilt) */
.card,.tile,.floater .pic,.round,#pet,.stepbar{background:var(--cream);border:3px solid var(--ink);box-shadow:0 6px 0 rgba(74,47,37,.2)}
.card{position:relative;flex:none;border-radius:30px;width:var(--cw,200px);height:var(--cw,200px);padding:0;cursor:pointer;
  font:inherit;color:var(--ink);animation:cardIn .45s cubic-bezier(.3,1.5,.5,1) backwards;overflow:visible}
.card::after{content:"";position:absolute;inset:0;border-radius:27px;pointer-events:none;opacity:.35;mix-blend-mode:multiply;background-image:var(--grain)}
.card:nth-child(odd){rotate:-1.6deg}.card:nth-child(even){rotate:1.4deg}
.card > svg,.card > .qmark{position:absolute;left:9%;top:9%;width:82%;height:82%;display:block;overflow:visible}
.card .qmark{display:grid;place-items:center}
.card .lbl{position:absolute;left:50%;bottom:-.9em;transform:translateX(-50%);background:var(--gold);border:3px solid var(--ink);border-radius:16px;
  padding:0 14px;font-size:clamp(20px,3.4vmin,30px);font-weight:800;white-space:nowrap}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}.card:nth-child(5){animation-delay:.32s}
@keyframes cardIn{from{transform:translateY(50px) scale(.6);opacity:0}}
.card.yay{animation:yay .7s}
@keyframes yay{30%{transform:scale(1.15) rotate(-5deg)}60%{transform:scale(.95) rotate(3deg)}}
.card.no{animation:no .5s}
@keyframes no{20%,60%{transform:translateX(-12px) rotate(-3deg)}40%,80%{transform:translateX(12px) rotate(3deg)}}
.card.good{background:#e9f8d8;border-color:#3f8445}
.card.hint::before,.tile.next::before{content:"";position:absolute;inset:-14px;border-radius:40px;border:5px dashed var(--gold);animation:spin 8s linear infinite,glow 1s ease-in-out infinite alternate;pointer-events:none}
@keyframes spin{to{rotate:360deg}}
@keyframes glow{to{box-shadow:0 0 0 10px rgba(255,210,63,.3)}}
.card.dim{opacity:.35;transition:opacity .3s}
.tap svg{width:100%;height:100%}
.tap{position:absolute;right:-6%;bottom:-6%;width:30%;height:33%;z-index:2;animation:tap 1s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
@keyframes tap{50%{transform:translate(-10%,-14%) scale(.9)}}

/* stage = where the lesson happens */
#stage{position:absolute;z-index:6;left:0;right:0;top:calc(max(12px,env(safe-area-inset-top)) + 92px);bottom:calc(var(--teacher-h) * .85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5vmin;padding:0 3vw 0 calc(var(--teacher-h) * .62);pointer-events:none}
@media (orientation:portrait){#stage{padding-left:3vw}}
#stage .row{display:flex;gap:3vmin;align-items:center;justify-content:center;flex-wrap:wrap}
#stage .card,#stage button{pointer-events:auto}
.sign{font-size:clamp(44px,9vmin,90px);font-weight:800;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke;line-height:1;text-shadow:0 5px 0 rgba(74,47,37,.25);animation:cardIn .4s backwards}
.qmark{font-size:clamp(60px,12vmin,120px);font-weight:800;color:var(--orange);-webkit-text-stroke:3px var(--ink);paint-order:stroke;line-height:1}

/* look & point scene */
.scenebox{position:relative;flex:none;border:4px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 7px 0 rgba(74,47,37,.2);pointer-events:auto;animation:cardIn .5s backwards}
.scenebox > svg{position:absolute;inset:0;width:100%;height:100%}
.sitem{position:absolute;width:23%;aspect-ratio:1;translate:-50% -50%;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--ink);animation:cardIn .5s backwards}
.sitem > svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 3px rgba(40,30,20,.22))}
.snum{position:absolute;left:-2%;top:-2%;width:26%;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--ink);font-weight:800;display:grid;place-items:center;font-size:clamp(13px,2.4vmin,22px);line-height:1}
.slbl{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 10px;font-weight:800;font-size:clamp(14px,2.6vmin,24px);white-space:nowrap;opacity:0;transition:opacity .3s}
.sitem.seen .slbl{opacity:1}
.sitem.glow::before{content:"";position:absolute;inset:-10%;border-radius:50%;border:5px dashed var(--gold);animation:spin 8s linear infinite,glow 1s ease-in-out infinite alternate;pointer-events:none}
.sitem.yay{animation:yay .7s}
#voiceBtn{left:calc(24px + clamp(60px,9vh,78px))}
.pg{position:absolute;top:50%;translate:0 -50%;width:clamp(54px,8vmin,74px);height:clamp(54px,8vmin,74px);border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(74,47,37,.2);cursor:pointer;display:grid;place-items:center;padding:0;z-index:2}
.pg svg{width:50%;height:50%}
.pg.prev{left:0}.pg.next{right:0}
.pg:disabled{opacity:.25}
.dots{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,250,241,.6);border:2px solid var(--ink)}
.dots i.on{background:var(--gold)}

/* floaters (catch game + map butterflies) */
#floaters{position:absolute;inset:0;z-index:7;pointer-events:none}
.floater{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;will-change:transform}
.floater .pic{width:var(--fw,120px);height:var(--fw,120px);border-radius:50%;padding:16%;display:grid;place-items:center;background:rgba(255,250,241,.92)}
.floater .pic svg{width:100%;height:100%;overflow:visible}
.floater.deco .pic{background:none;border:0;box-shadow:none;padding:0}
.floater .wig.go{animation:wiggle .6s}
.floater.gone{transition:transform .35s ease-in,opacity .35s;opacity:0}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.15)}40%{transform:rotate(12deg) scale(1.15)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}

/* map */
#map{position:absolute;z-index:6;left:calc(var(--teacher-h) * .78);right:3vw;top:calc(max(12px,env(safe-area-inset-top)) + 96px);bottom:calc(var(--teacher-h) * .95)}
@media (orientation:portrait){#map{left:4vw;right:4vw;bottom:calc(var(--teacher-h) + 3vh)}}
#map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tile{position:absolute;width:var(--tw);height:var(--tw);border-radius:50%;translate:-50% -50%;padding:0;cursor:pointer;font:inherit;color:var(--ink);
  animation:cardIn .5s backwards}
.tile::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:.3;mix-blend-mode:multiply;background-image:var(--grain)}
.tile > svg{position:absolute;left:15%;top:15%;width:70%;height:70%;overflow:visible}
.tile .num{position:absolute;left:-8%;top:-8%;width:36%;aspect-ratio:1;border-radius:50%;background:var(--orange);color:#fff;border:3px solid var(--ink);
  display:grid;place-items:center;font-weight:800;font-size:calc(var(--tw) * .2);line-height:1}
.tile .stars{position:absolute;left:50%;bottom:-24%;transform:translateX(-50%);display:flex;gap:2px}
.tile .stars svg{width:calc(var(--tw) * .24);height:calc(var(--tw) * .24)}
.tile.done{background:#fff4c9}
.tile.locked{filter:grayscale(.9);opacity:.55}
.tile.locked .num{background:#9a8a80}
.tile.next{animation:cardIn .5s backwards,breathe 1.6s ease-in-out infinite}
.tile.no{animation:no .5s}

/* top UI */
#ui{position:absolute;inset:0;z-index:10;pointer-events:none}
#ui > *{pointer-events:auto}
.round{position:absolute;top:max(12px,env(safe-area-inset-top));width:clamp(60px,9vh,78px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font:inherit}
.round svg{width:55%;height:55%}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,47,37,.2)}
#home{left:12px}
#micBtn{left:12px}
#micBtn.off{opacity:.55}
#micBtn.off::after{content:"";position:absolute;width:70%;height:5px;background:var(--red);rotate:-45deg;border-radius:3px}
.stepbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:6px 14px;border-radius:30px}
.stepbar i{width:clamp(36px,5.5vh,48px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#efe5d4;border:2px solid rgba(74,47,37,.25);transition:.3s}
.stepbar i svg{width:62%;height:62%;opacity:.4}
.stepbar i.done{background:#bfe39a}
.stepbar i.done svg{opacity:1}
.stepbar i.now{background:var(--gold);border-color:var(--ink);transform:scale(1.18)}
.stepbar i.now svg{opacity:1}
#pet{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;border-radius:24px;padding:8px 12px 10px;text-align:center;width:clamp(104px,15vh,130px)}
#petArt{height:clamp(46px,7vh,62px);display:grid;place-items:center}
#petArt > div{height:100%;aspect-ratio:1.6;display:grid;place-items:center;transition:transform .4s}
#petArt svg{max-width:100%;max-height:100%}
#petArt.shake > div{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#petDots{display:flex;gap:5px;justify-content:center;margin-top:6px}
#petDots i{width:12px;height:12px;border-radius:50%;background:#e7dccb}
#petDots i.on{background:#8cc63e;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
body.map .lesson-only, body.lesson .map-only{display:none !important}

/* listening */
#listen{position:absolute;right:5vw;bottom:5vh;display:none;flex-direction:column;align-items:center;gap:10px;z-index:11}
#listen.show{display:flex}
#mic{width:100px;height:100px;border-radius:50%;background:var(--red);border:3px solid var(--ink);display:grid;place-items:center;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18)}
#mic svg{width:46px;height:46px}
#mic::before,#mic::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:4px solid var(--red);animation:ring 1.4s infinite}
#mic::after{animation-delay:.7s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
#listen .say{font-size:26px;font-weight:800;background:#fff;border:3px solid var(--ink);padding:0 18px;border-radius:16px}
#toast{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;
  border-radius:14px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;z-index:30}
#toast.show{opacity:.92}

/* fx */
.fx{position:fixed;z-index:25;pointer-events:none}
.spark{font-size:28px;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(160deg);opacity:0}}
.netfx{width:120px;animation:swoop .7s ease-in-out forwards}
@keyframes swoop{0%{transform:translate(60px,-80px) rotate(40deg);opacity:0}40%{opacity:1}70%{transform:translate(0,0) rotate(-20deg)}100%{transform:translate(-10px,10px) rotate(-30deg);opacity:0}}
#flowerBed .grow{animation:grow .9s cubic-bezier(.3,1.5,.5,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{transform:scale(0)}}
.sticker{--cw:clamp(220px,46vmin,400px);background:#fff4c9 !important;border-width:4px !important}
.sticker .stars{position:absolute;top:-16%;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.sticker .stars svg{width:calc(var(--cw) * .2);height:calc(var(--cw) * .2);animation:cardIn .5s backwards}
.sticker .stars svg:nth-child(2){animation-delay:.25s;translate:0 -18%}.sticker .stars svg:nth-child(3){animation-delay:.5s}

/* start */
#start{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(74,166,224,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#start .box{text-align:center;padding:24px}
#start h1{font-size:clamp(44px,9vh,84px);margin:0;line-height:1;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke;text-shadow:0 6px 0 rgba(74,47,37,.3)}
#start p{margin:6px 0 22px;font-size:22px;font-weight:800;color:var(--ink)}
#play{width:140px;height:140px;border-radius:50%;border:4px solid var(--ink);background:var(--orange);cursor:pointer;
  box-shadow:0 8px 0 #b9541a;animation:breathe 1.6s ease-in-out infinite}
#play svg{width:60px;height:60px;margin-left:8px}
@keyframes breathe{50%{transform:scale(1.07)}}
#start small{display:block;margin-top:22px;font-size:15px;background:rgba(255,250,241,.85);border-radius:12px;padding:4px 12px}
</style>
</head>
<body class="map">
<div id="scene">
  <div id="decor"></div>
  <div id="foliageBack" class="foliage"></div>
  <div id="teacher" aria-label="Miss Bloom – tap to hear again"></div>
  <div id="foliageFront" class="foliage"></div>
  <div id="map" class="map-only"></div>
  <div id="stage" class="lesson-only"></div>
  <div id="floaters"></div>
  <div id="bubble"></div>
  <div id="ui">
    <button class="round lesson-only" id="home" aria-label="Back to map"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5" fill="none" stroke="#4a2f25" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h13V10" fill="#f6922b" stroke="#4a2f25" stroke-width="2.2" stroke-linejoin="round"/><path d="M10 19.5v-5h4v5" fill="#fff4c9" stroke="#4a2f25" stroke-width="2"/></svg></button>
    <button class="round map-only" id="voiceBtn" aria-label="Change Miss Bloom's voice"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#ffd23f" stroke="#4a2f25" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="#4a2f25" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="round map-only" id="micBtn" aria-label="Microphone on/off"><svg viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="11" rx="3.5" fill="#ec4b3c" stroke="#4a2f25" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="#4a2f25" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    <div class="stepbar lesson-only" id="steps"></div>
    <div id="pet" class="map-only" aria-label="My caterpillar"><div id="petArt"><div></div></div><div id="petDots"></div></div>
    <div id="listen"><div id="mic"><svg viewBox="0 0 24 24" fill="#fff"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 17v4" stroke="#fff" stroke-width="2"/></svg></div><div class="say">Your turn!</div></div>
    <div id="toast"></div>
  </div>
</div>
<div id="start"><div class="box">
  <h1>Little Word Garden</h1>
  <p>Vườn từ vựng của bé 🌱</p>
  <button id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg></button>
  <small>Bố mẹ: bật tiếng iPad (tắt chế độ im lặng). Nút micro ở góc trái để bật/tắt phần bé tập nói.</small>
</div></div>

<script src="art.js"></script>
<script src="art-items.js"></script>
<script src="art-more.js"></script>
<script src="lessons.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const store = {
  get(k, d) { try { const v = localStorage.getItem('lwg_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lwg_' + k, JSON.stringify(v)); } catch (e) {} },
};
const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const PRAISE = ['Yay! You did it!', 'Good job!', 'Wow! Great job!', 'You got it!', 'Hooray!', 'Super!', 'Yes! Well done!'];
const STAR = '<svg viewBox="-12 -12 24 24"><path d="M0-11L3.2-3.6L11-3.4L4.9 1.6L7 9.4L0 5L-7 9.4L-4.9 1.6L-11-3.4L-3.2-3.6Z" fill="#ffd23f" stroke="#4a2f25" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const STAR_OFF = STAR.replace('#ffd23f', '#e7dccb');
const HAND = '<svg viewBox="0 0 40 44"><path d="M14 4c3 0 4 2 4 4v12l2-1c2-1 4 0 5 2l1-1c2-1 4 0 5 2l1-.5c2-1 4 0 4 3v8c0 7-5 11-12 11h-3c-4 0-7-2-9-5L5 27c-1-2 0-4 2-4s3 1 4 2l-1-17c0-2 1-4 4-4z" fill="#fff" stroke="#4a2f25" stroke-width="2.4" stroke-linejoin="round"/></svg>';

/* ---------- scene ---------- */
const style = document.createElement('style'); style.textContent = ART.css || ''; document.head.appendChild(style);
$('#decor').innerHTML = ART.decor();
$('#foliageBack').innerHTML = ART.foliageBack();
$('#foliageFront').innerHTML = ART.foliageFront();
const teacher = $('#teacher'); teacher.innerHTML = ART.teacher();
const bubble = $('#bubble'), stage = $('#stage');

/* ---------- cancel-able waiting (Home button stops everything) ---------- */
const live = new Set();
function waitFor(fn) {
  return new Promise((resolve, reject) => {
    const h = { reject, cleanup: null };
    live.add(h);
    fn(v => { if (live.delete(h)) resolve(v); }, h);
  });
}
function abortAll() {
  for (const h of [...live]) { live.delete(h); try { h.cleanup && h.cleanup(); } catch (e) {} h.reject(new Error('abort')); }

/* ---------- Miss Bloom speaks ---------- */
let voice = null;
// soft, friendly voices first; on iPad "(Enhanced)/(Premium)" voices sound much nicer (Settings > Accessibility > Spoken Content > Voices)
const VOICE_PREF = ['Ava', 'Zoe', 'Allison', 'Samantha', 'Susan', 'Nicky', 'Karen', 'Serena', 'Kate', 'Stephanie', 'Tessa', 'Moira', 'Google US English', 'Microsoft Ava', 'Microsoft Jenny', 'Microsoft Aria', 'Google UK English Female', 'Microsoft Zira'];
const MALE = /daniel|fred|alex\b|tom\b|aaron|arthur|gordon|rishi|oliver|reed|rocko|eddy|grandpa|ralph|albert|bruce|junior|male|guy|david|mark|george|ryan|james/i;

function voiceScore(v) {

  let q = /premium/i.test(id) ? 40 : /enhanced|natural|neural|online/i.test(id) ? 30 : 0;
  const i = VOICE_PREF.findIndex(p => v.name.includes(p)); if (i >= 0) q += 24 - i;

/* natural voice: pre-made clips in voice/<fnv32 of phrase>.mp3 (made with Kokoro, see voice-tools/make_voice.py).

      .then(b => new Promise((res, rej) => AC.decodeAudioData(b, res, rej)));

$('#voiceBtn').addEventListener('click', () => {

let bubbleTimer = 0, lastLine = '';
// Miss Bloom talks slowly and warmly: each phrase is spoken separately with a little pause,
// and exclamations go a bit higher, like a sing-song kids' teacher.
function say(text, { rate = 0.8, pitch = 1.18, remember = false } = {}) {
  if (remember) lastLine = text;
  return waitFor((done, h) => {
    clearTimeout(bubbleTimer);
    bubble.textContent = text.replace(/\.\.\./g, '…'); bubble.classList.add('show');
    teacher.classList.add('talking');
    let timer = 0, gap = 0, fin = false;
    const end = () => {
      if (fin) return; fin = true; clearTimeout(timer); clearTimeout(gap);
      teacher.classList.remove('talking');
      bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 4000);
      done();
    };
    let src = null;
    h.cleanup = () => { fin = true; clearTimeout(timer); clearTimeout(gap); teacher.classList.remove('talking'); try { src && src.stop(); } catch (e) {} };
    const parts = splitParts(text);
    if (hasClips(parts)) {
      try { speechSynthesis.cancel(); } catch (e) {}
      if (AC.state === 'suspended') AC.resume();
      const bufs = parts.map(p => loadClip(fnv(p))); // start all downloads at once
      (async () => {
        for (let k = 0; k < parts.length; k++) {
          let buf; try { buf = await bufs[k]; } catch (e) { continue; }
          if (fin) return;
          await new Promise(r => { src = AC.createBufferSource(); src.buffer = buf; src.connect(AC.destination); src.onended = r; src.start(); });
          if (fin) return;
          await new Promise(r => { gap = setTimeout(r, /[.!?]$/.test(parts[k]) ? 170 : 70); });
        }
        end();
      })();
      timer = setTimeout(end, 5000 + text.length * 150);
      return;
    }
    if (useClips && CLIPS) console.warn('[voice] no clip for:', parts.filter(p => !CLIPS.has(fnv(p))));
    if (!('speechSynthesis' in window)) { timer = setTimeout(end, 700 + text.length * 70); return; }
    speechSynthesis.cancel();
    let i = 0;
    const next = () => {
      if (fin) return;
      if (i >= parts.length) return end();
      const p = parts[i], u = new SpeechSynthesisUtterance(p);
      u.lang = 'en-US'; if (voice) u.voice = voice;
      u.rate = rate; u.pitch = Math.min(2, pitch + (/!$/.test(p) ? .12 : /\?$/.test(p) ? .08 : 0));
      u.onend = u.onerror = () => { i++; gap = setTimeout(next, /[.!?…]$/.test(p) ? 280 : 120); };
      speechSynthesis.speak(u);
    };
    timer = setTimeout(end, 3000 + text.length * 120 + parts.length * 300); // safety net (iPad sometimes skips onend)
    next();
  });
}

function listenOnce(ms = 5500) {
  return waitFor((done, h) => {
    const alts = []; let fin = false; const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
    const finish = r => {
      if (fin) return; fin = true; clearTimeout(t);
      $('#listen').classList.remove('show'); teacher.classList.remove('listening');
      try { rec.abort(); } catch (e) {}
      done(r);

    h.cleanup = () => { fin = true; clearTimeout(t); $('#listen').classList.remove('show'); teacher.classList.remove('listening'); try { rec.abort(); } catch (e) {} };

const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}

function isMatch(alts, aliases) {
  for (const a of alts || []) {
    const n = norm(a); if (!n) continue;
    const words = n.split(' '), joined = n.replace(/ /g, '');
    for (const al of aliases) {
      const an = norm(al), aj = an.replace(/ /g, '');
      if (aj.length <= 2) { if (words.includes(an)) return true; continue; }
      if ((' ' + n + ' ').includes(' ' + an + ' ') || joined.includes(aj)) return true;
      if (aj.length >= 5 && sim(joined, aj) >= 0.6) return true;
      if (aj.length >= 4 && words.some(w => sim(w, aj) >= 0.7)) return true;

const W = id => WORDS[id];
const kindOf = id => W(id).kind || 'noun';
const aOf = id => W(id).a || ((/^[aeiou]/i.test(W(id).name) ? 'an ' : 'a ') + W(id).name);

const plural = (n, word) => n === 1 ? word : word + 's';
const HOME = {}; LESSONS.forEach(L => (L.words || []).forEach(id => { if (!HOME[id]) HOME[id] = L; }));
const tplFor = (id, key) => W(id)[key] || (HOME[id] && HOME[id][key]);
const fill = (t, id) => { const w = W(id), a = aOf(id);
  return t.replace(/\{name\}/g, w.name).replace(/\{Name\}/g, cap(w.name)).replace(/\{a\}/g, a).replace(/\{A\}/g, cap(a))
    .replace(/\{pl\}/g, plOf(id)).replace(/\{sound\}/g, w.sound || '').replace(/\s+/g, ' ').trim(); };
const P = {
  intro(id) { const t = tplFor(id, 'intro'); if (t) return fill(t, id);
    const w = W(id), n = w.name, k = kindOf(id);
    if (k === 'color') return `This butterfly is ${n}. ${cap(n)}!`;
    if (k === 'number') return `${cap(n)}! ${cap(n)} ${plural(w.n, 'ladybug')}.`;
    return `This is ${aOf(id)}. ${cap(n)}!`; },
  ask(id) { const t = tplFor(id, 'ask'); if (t) return fill(t, id);
    const w = W(id), n = w.name, k = kindOf(id);
    if (k === 'color') return `Which butterfly is ${n}?`;
    if (k === 'number') return w.n === 1 ? 'Where is one ladybug?' : `Where are ${n} ladybugs?`;
    return `Where ${w.plural ? 'are' : 'is'} the ${n}? Can you find it?`; },
  that(id) { const n = W(id).name, k = kindOf(id);

  catch(id) { const t = tplFor(id, 'catch'); if (t) return fill(t, id);
    const w = W(id), n = w.name, k = kindOf(id);
    if (k === 'color') return `Catch the ${n} butterfly!`;

    return `Catch the ${n}!`; },

const floaters = [];
function floatBounds(fl) {
  const W = innerWidth, H = innerHeight, s = fl.el.offsetWidth || 120;
  const th = teacher.offsetHeight, portrait = H > W;
  const x0 = portrait ? W * .03 : Math.min(W * .4, th * .72), y1 = H - th * (portrait ? 1 : .6) - s;
  return { x0, x1: W * .97 - s, y0: H * .13, y1: Math.max(H * .13 + 10, y1) };

  el.style.setProperty('--fw', deco ? 'clamp(60px,9vmin,90px)' : 'clamp(100px,17vmin,160px)');
  el.innerHTML = `<div class="wig"><div class="pic">${html}</div></div>`;
  $('#floaters').appendChild(el);
  const fl = { el, wig: el.firstChild, value, speed: speed * rand(.8, 1.25), x: 0, y: 0, phase: rand(0, 6.28), paused: false };
  const r = floatBounds(fl);
  if (from) { fl.x = from.x; fl.y = from.y; } else { fl.x = rand(r.x0, r.x1); fl.y = rand(r.y0, r.y1); }
  newTarget(fl); floaters.push(fl);

}
const PER = 6; let mapPage = null;
const ARROW = d => `<svg viewBox="0 0 24 24"><path d="${d}" fill="#f6922b" stroke="#4a2f25" stroke-width="2" stroke-linejoin="round"/></svg>`;
function layoutMap() {
  const map = $('#map'); map.innerHTML = '';
  const pages = Math.ceil(LESSONS.length / PER), nextIdx = LESSONS.findIndex(L => !done[L.id]);
  if (mapPage == null) mapPage = Math.floor(Math.max(0, nextIdx) / PER);
  mapPage = Math.max(0, Math.min(pages - 1, mapPage));
  const rect = map.getBoundingClientRect(), portrait = innerHeight > innerWidth;
  const cols = portrait ? 2 : 3, rows = Math.ceil(PER / cols), padX = 12;
  const tw = Math.min(rect.width * (1 - padX * 2 / 100) / cols * .62, rect.height / rows * .64, 170);
  const idxs = LESSONS.map((_, i) => i).slice(mapPage * PER, mapPage * PER + PER);
  const pts = idxs.map((_, k) => {
    const r = Math.floor(k / cols), c0 = k % cols, c = r % 2 ? cols - 1 - c0 : c0; // snake path
    return [padX + ((c + .5) / cols) * (100 - padX * 2), ((r + .5) / rows) * 100 + (c % 2 ? 5 : -5)];
  });
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  path.setAttribute('class', 'path'); path.setAttribute('viewBox', '0 0 100 100'); path.setAttribute('preserveAspectRatio', 'none');
  let d = ''; pts.forEach(([x, y], i) => { d += (i ? 'L' : 'M') + x + ' ' + y; });
  path.innerHTML = `<path d="${d}" fill="none" stroke="#fff4c9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".85"/><path d="${d}" fill="none" stroke="#d9b98a" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  map.appendChild(path);
  idxs.forEach((i, k) => {
    const L = LESSONS[i], t = document.createElement('button');
    const stars = done[L.id] || 0, unlocked = isUnlocked(i);
    t.className = 'tile' + (stars ? ' done' : '') + (!unlocked ? ' locked' : '') + (i === nextIdx ? ' next' : '');
    t.dataset.i = i;
    t.style.left = pts[k][0] + '%'; t.style.top = pts[k][1] + '%'; t.style.setProperty('--tw', tw + 'px'); t.style.animationDelay = k * .05 + 's';
    t.innerHTML = lessonIcon(L) + `<span class="num">${i + 1}</span>` + (stars ? `<span class="stars">${[1, 2, 3].map(n => n <= stars ? STAR : STAR_OFF).join('')}</span>` : '');
    t.setAttribute('aria-label', L.title);
    // parents: press and hold a locked lesson for 2 seconds to open it
    let hold = 0;
    t.addEventListener('pointerdown', () => { hold = setTimeout(() => { hold = -1; openLesson(i, true); }, 2000); });
    t.addEventListener('pointerup', () => { if (hold > 0) { clearTimeout(hold); openLesson(i); } hold = 0; });
    t.addEventListener('pointerleave', () => { if (hold > 0) clearTimeout(hold); hold = 0; });
    map.appendChild(t);
  });
  const prev = document.createElement('button'), next = document.createElement('button');
  prev.className = 'pg prev'; next.className = 'pg next';
  prev.innerHTML = ARROW('M16 4L6 12l10 8z'); next.innerHTML = ARROW('M8 4l10 8-10 8z');
  prev.disabled = mapPage === 0; next.disabled = mapPage === pages - 1;
  prev.onclick = () => { sfx('pop'); mapPage--; layoutMap(); };
  next.onclick = () => { sfx('pop'); mapPage++; layoutMap(); };
  const dots = document.createElement('div'); dots.className = 'dots';
  dots.innerHTML = Array.from({ length: pages }, (_, p) => `<i class="${p === mapPage ? 'on' : ''}"></i>`).join('');
  map.append(prev, next, dots);
}
function openLesson(i, force = false) {
  unlockAudio();
  const L = LESSONS[i], tile = $('#map').querySelector(`.tile[data-i="${i}"]`);
  if (!force && !isUnlocked(i)) { sfx('boop'); bump(tile, 'no'); say("Let's finish the shiny one first!").catch(() => {}); return; }
  sfx('pop'); runLesson(L);
}
function showMap(greet = true) {
  abortAll(); mapPage = null; clearStage(); setMode('map');
  layoutMap(); renderPet(); spawnMapButterflies();
  lastLine = 'Tap the shiny flower to play!';
  if (greet) say(pick(['Where shall we go next?', 'Tap the shiny one!', "Let's play again!"]), { remember: false }).catch(() => {});
}
function setMode(m) { document.body.className = m; }
addEventListener('resize', () => { if (document.body.className === 'map') layoutMap(); });

/* ---------- LESSON ---------- */
let stats = { miss: 0 }, runId = 0;
$('#home').addEventListener('click', () => { runId++; showMap(); });

async function runLesson(L) {
  const my = ++runId;
  abortAll(); clearFloaters(); setMode('lesson'); setStep(0); stats = { miss: 0 };
  try {
    if (L.type === 'math') await runMath(L); else await runWords(L);
    setStep(5); await reward(L);
  } catch (e) { if (e.message !== 'abort') console.error(e); }
  if (my === runId) showMap(false);
}

function prevWords(L) {
  const i = LESSONS.indexOf(L);
  for (let j = i - 1; j >= 0; j--) if (LESSONS[j].words) return shuffle(LESSONS[j].words).slice(0, 2);
  return [];
}
function optionsFor(target, pool) {
  const k = kindOf(target);
  let others = shuffle(pool.filter(id => id !== target && kindOf(id) === k));
  if (others.length < 2) others = others.concat(shuffle(Object.keys(WORDS).filter(id => id !== target && kindOf(id) === k && !others.includes(id))));
  return shuffle([target, ...others.slice(0, 2)]);
}

async function learnWord(id) {
  clearStage();
  const c = makeCard(W(id).art(), { size: 'l', label: W(id).name });
  stage.append(c);
  await say(P.intro(id), { remember: true });
  const hand = document.createElement('div'); hand.className = 'tap'; hand.innerHTML = HAND; c.appendChild(hand);
  let t = await tapOrTimeout([c], 6000);
  if (!t) { await say(`Tap the ${W(id).name}!`); t = await tapOrTimeout([c], 6000); }
  hand.remove();
  sfx('pop'); bump(c, 'yay'); const p = centerOf(c); sparkle(p.x, p.y, 8);
  await say(cap(W(id).name) + '!', { rate: .72 });
  await wait(250);
}

function sizeScene(box) {
  const sw = stage.clientWidth - parseFloat(getComputedStyle(stage).paddingLeft) - parseFloat(getComputedStyle(stage).paddingRight);
  const w = Math.min(sw, stage.clientHeight * 400 / 260, 900);
  box.style.width = w + 'px'; box.style.height = w * 260 / 400 + 'px';
}
addEventListener('resize', () => { const b = stage.querySelector('.scenebox'); if (b) sizeScene(b); });
async function lookAndPoint(L) {
  clearStage();
  const box = document.createElement('div'); box.className = 'scenebox';
  box.innerHTML = ART.scene(L.scene || 'meadow');
  stage.append(box); sizeScene(box);
  const SLOTS = L.words.length === 5 ? [[15, 62], [32, 34], [50, 64], [68, 34], [85, 62]] : [[18, 60], [39, 35], [61, 62], [82, 36]];
  const items = L.words.map((id, i) => {
    const b = document.createElement('button'); b.className = 'sitem'; b.value = id;
    b.style.left = SLOTS[i][0] + '%'; b.style.top = SLOTS[i][1] + '%'; b.style.animationDelay = (.2 + i * .12) + 's';
    b.innerHTML = W(id).art() + (kindOf(id) === 'number' ? '' : `<span class="snum">${i + 1}</span>`) + `<span class="slbl">${W(id).name}</span>`;
    box.append(b); return b;
  });
  await say(pick(["Ooh, look!... Let's listen and point!", "Look!... Let's point and say!"]));
  for (const [i, id] of L.words.entries()) {
    const b = items[i]; b.classList.add('glow');
    await say(P.intro(id), { remember: true });
    let t = await tapOrTimeout([b], 6000);
    if (!t) { await say(`Can you point to the ${W(id).name}?... Tap it!`); t = await tapOrTimeout([b], 7000); }
    b.classList.remove('glow'); b.classList.add('seen'); sfx('pop'); bump(b, 'yay');
    const p = centerOf(b); sparkle(p.x, p.y, 8);
    await say(`${cap(W(id).name)}!`, { rate: .7 });
    await wait(200);
  }
  // free play: tap any picture to hear it again
  await say('Now you!... Tap and listen!');
  const until = Date.now() + 6000;
  while (Date.now() < until) {
    const b = await tapOrTimeout(items, until - Date.now());
    if (!b) break;
    sfx('pop'); bump(b, 'yay'); await say(`${cap(W(b.value).name)}!`, { rate: .7 });
  }
}

async function findWord(target, pool) {
  clearStage();
  const ids = optionsFor(target, pool);
  const cards = ids.map(id => makeCard(W(id).art(), { size: 'm', value: id }));
  stage.append(row(...cards));
  await say(P.ask(target), { remember: true });
  let wrong = 0;
  for (;;) {
    const c = await tapOnce(cards);
    if (c.value === target) {
      sfx('ding'); bump(c, 'yay'); c.classList.add('good'); cheer(); sprout();
      const p = centerOf(c); sparkle(p.x, p.y, 14);
      cards.forEach(o => { if (o !== c) o.classList.add('dim'); });
      await say(`${pick(PRAISE)} ${P.got(target)}`);
      return;
    }
    sfx('boop'); bump(c, 'no'); stats.miss++; wrong++;
    if (wrong >= 2) cards.find(o => o.value === target).classList.add('hint');
    await say(`${P.that(c.value)} Let's try again! ${P.ask(target)}`);
  }
}

async function catchGame(targets, pool, { label = id => W(id).art(), prompt = id => P.catch(id), rounds = 3 } = {}) {
  clearStage();
  const k = kindOf(targets[0]);
  const shown = shuffle([...new Set([...targets, ...pool.filter(id => kindOf(id) === k)])]).slice(0, 5);
  targets.forEach(t => { if (!shown.includes(t)) shown[shown.length - 1] = t; });
  const fls = shown.map(id => addFloater(label(id), { value: id }));
  const order = shuffle(targets).concat(shuffle(targets)).slice(0, rounds);
  for (const target of order) {
    await say(prompt(target), { remember: true });
    for (;;) {
      const el = await tapOnce(fls.map(f => f.el));
      const fl = fls.find(f => f.el === el);
      if (fl.value === target) {
        const p = centerOf(el);
        const net = document.createElement('div'); net.className = 'fx netfx'; net.innerHTML = ART.net();
        net.style.left = p.x - 60 + 'px'; net.style.top = p.y - 76 + 'px'; document.body.appendChild(net); setTimeout(() => net.remove(), 800);
        fl.paused = true; wiggle(fl); sfx('ding');
        await wait(420); sparkle(p.x, p.y, 16); cheer(); sprout();
        await say(`${pick(PRAISE)} ${typeof target === 'string' && WORDS[target] ? P.got(target) : ''}`);
        fl.paused = false; newTarget(fl);
        break;
      }
      sfx('boop'); wiggle(fl); stats.miss++;
      await say(`${typeof fl.value === 'string' && WORDS[fl.value] ? P.that(fl.value) : 'Oops!'} Try again! ${prompt(target)}`);
    }
  }
  clearFloaters();
}

// speaking practice – always ends happily
async function speakIt(question, aliases, answerLine, cardEl) {
  clearStage(); stage.append(cardEl);
  await say(question, { remember: true });
  let ok = false;
  if (micOn) {
    const r = await listenOnce();
    if (['not-allowed', 'service-not-allowed', 'start', 'audio-capture'].includes(r.error)) {
      micOn = false; renderMicBtn(); toast('Micro chưa dùng được – bé nói theo cô là được rồi!');
    } else ok = isMatch(r.alts, aliases);
  } else {
    $('#listen').classList.add('show'); await wait(2800); $('#listen').classList.remove('show');
  }
  if (ok) { sfx('ding'); bump(cardEl, 'yay'); cheer(); sprout(); await say(`${pick(['Wow!', 'Yay!', 'Yes!'])} I heard you! Great talking!`); }
  else { bump(cardEl, 'yay'); await say(answerLine); }
}

async function runWords(L) {
  const words = L.words, review = prevWords(L).filter(id => !words.includes(id)), pool = [...words, ...review];
  await say(`Hi friend!... Today we're learning... ${L.title}! Let's go!`);
  setStep(1); await lookAndPoint(L);
  setStep(2); for (const id of shuffle(pool)) await findWord(id, pool);
  setStep(3); await catchGame(words, pool);
  setStep(4);
  for (const id of shuffle(words).slice(0, 2)) {
    await speakIt(`Can you say ${W(id).name}?... ${cap(W(id).name)}.`, W(id).alias || [W(id).name], `${cap(W(id).name)}! Good talking!`, makeCard(W(id).art(), { size: 'l', label: W(id).name }));
  }
}

/* ---------- maths ---------- */
async function runMath(L) {
  const T = L.thing, plus = L.op === '+';
  const res = ([a, b]) => plus ? a + b : a - b;
  const opWord = plus ? 'plus' : 'take away';
  const sentence = s => `${cap(NUM[s[0]])} ${opWord} ${NUM[s[1]]} is ${NUM[res(s)]}.`;
  const group = n => ART.group(n, T, false);
  const eqRow = (s, ans) => {
    const q = ans == null ? (() => { const d = makeCard('<div class="qmark">?</div>', { size: 's' }); return d; })() : makeCard(group(ans), { size: 's' });
    return row(makeCard(group(s[0]), { size: 's' }), sign(plus ? '+' : '−'), makeCard(group(s[1]), { size: 's' }), sign('='), q);
  };
  await say(plus ? "Hi friend!... Let's add!... Count with me!" : "Hi friend!... Let's take away!... Count with me!");

  // 1 learn: two worked examples, built up piece by piece
  setStep(1);
  for (const s of L.sums.slice(0, 2)) {
    clearStage();
    const r = row(); stage.append(r);
    const A = makeCard(group(s[0]), { size: 's' }); r.append(A);
    await say(`${cap(NUM[s[0]])} ${plural(s[0], T)}.`);
    r.append(sign(plus ? '+' : '−'), makeCard(group(s[1]), { size: 's' }));
    await say(plus ? `Plus ${NUM[s[1]]} ${plural(s[1], T)}.` : `Take away ${NUM[s[1]]}.`);
    const R = makeCard(group(res(s)), { size: 's' }); r.append(sign('='), R);
    sfx('pop'); bump(R, 'yay');
    await say(`${cap(NUM[res(s)])} ${plural(res(s), T)}! ${sentence(s)}`, { remember: true });
    await wait(600);
  }

  // 2 find: tap the answer
  setStep(2);
  for (const s of shuffle(L.sums).slice(0, 4)) {
    clearStage();
    const ans = res(s);
    const opts = shuffle([ans, ...shuffle([1, 2, 3, 4, 5].filter(n => n !== ans)).slice(0, 2)]);
    const eq = eqRow(s, null), cards = opts.map(n => makeCard(ART.numeral(n), { size: 's', value: n }));
    stage.append(eq, row(...cards));
    await say(`${cap(NUM[s[0]])} ${opWord} ${NUM[s[1]]} is...?`, { remember: true });
    let wrong = 0;
    for (;;) {
      const c = await tapOnce(cards);
      if (+c.value === ans) {
        sfx('ding'); bump(c, 'yay'); c.classList.add('good'); cheer(); sprout();
        const q = eq.lastChild; q.innerHTML = group(ans); bump(q, 'yay');
        const p = centerOf(c); sparkle(p.x, p.y, 14);
        await say(`${pick(PRAISE)} ${sentence(s)}`);
        break;
      }
      sfx('boop'); bump(c, 'no'); stats.miss++; wrong++;
      if (wrong >= 2) cards.find(o => +o.value === ans).classList.add('hint');
      await say(`Hmm, let's count again! ${cap(NUM[s[0]])} ${opWord} ${NUM[s[1]]} is...?`);
    }
  }

  // 3 catch the answer (equation stays on screen)
  setStep(3);
  const sums3 = shuffle(L.sums).slice(0, 3);
  clearStage();
  const answers = [1, 2, 3, 4, 5];
  const fls = answers.map(n => addFloater(ART.numeral(n), { value: n }));
  for (const s of sums3) {
    clearStage(); stage.style.justifyContent = 'flex-start'; stage.append(eqRow(s, null));
    stage.querySelectorAll('.card').forEach(c => c.style.pointerEvents = 'none');
    await say(`${cap(NUM[s[0]])} ${opWord} ${NUM[s[1]]}... Catch the answer!`, { remember: true });
    for (;;) {
      const el = await tapOnce(fls.map(f => f.el));
      const fl = fls.find(f => f.el === el);
      if (fl.value === res(s)) {
        const p = centerOf(el); fl.paused = true; wiggle(fl); sfx('ding');
        const net = document.createElement('div'); net.className = 'fx netfx'; net.innerHTML = ART.net();
        net.style.left = p.x - 60 + 'px'; net.style.top = p.y - 76 + 'px'; document.body.appendChild(net); setTimeout(() => net.remove(), 800);
        await wait(420); sparkle(p.x, p.y, 16); cheer(); sprout();
        const q = stage.querySelector('.row').lastChild; q.innerHTML = group(res(s)); bump(q, 'yay');
        await say(`${pick(PRAISE)} ${sentence(s)}`);
        fl.paused = false; newTarget(fl);
        break;
      }
      sfx('boop'); wiggle(fl); stats.miss++;
      await say(`That's ${NUM[fl.value]}. Let's count again!`);
    }
  }
  clearFloaters(); stage.style.justifyContent = '';

  // 4 say the answer
  setStep(4);
  for (const s of shuffle(L.sums).slice(0, 2)) {
    const ans = res(s), wrap = document.createElement('div');
    wrap.append(eqRow(s, null));
    await speakIt(`${cap(NUM[s[0]])} ${opWord} ${NUM[s[1]]} is...? Say it!`, WORDS[NUM[ans]].alias, `${cap(NUM[ans])}! ${sentence(s)}`, wrap.firstChild);
    const q = stage.querySelector('.row')?.lastChild; if (q) { q.innerHTML = group(ans); bump(q, 'yay'); }
    await wait(700);
  }
}

/* ---------- reward ---------- */
async function reward(L) {
  clearStage();
  const stars = stats.miss <= 1 ? 3 : stats.miss <= 4 ? 2 : 1;
  const first = !(L.id in done) || !done[L.id];
  done[L.id] = Math.max(done[L.id] || 0, stars); store.set('done', done);
  const c = makeCard(lessonIcon(L), { size: 'l', label: L.title });
  c.classList.add('sticker');
  c.insertAdjacentHTML('beforeend', `<span class="stars">${[1, 2, 3].map(k => k <= stars ? STAR : STAR_OFF).join('')}</span>`);
  stage.append(c);
  sfx('tada'); cheer();
  setTimeout(() => { const p = centerOf(c); sparkle(p.x, p.y, 24); }, 300);
  await say(`Yay! You did it!... You finished ${L.title}! Here's your sticker!`);
  if (first) {
    progress++; store.set('progress', progress);
    if (progress >= PET_MAX) {
      progress = 0; store.set('progress', 0);
      const col = pick(BF_COLORS); butterflies.push(col); store.set('butterflies', butterflies);
      await say('Look! Your caterpillar is a butterfly now!');
    }
  }
  await tapOrTimeout([c], 3500);
}

/* ---------- start ---------- */
renderPet();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
setMode('map');
$('#play').addEventListener('click', async () => {
  unlockAudio(); pickVoice();
  $('#start').remove();
  showMap(false);
  try {
    await say("Hi friend! I'm Miss Bloom!");
    await say(Object.keys(done).length ? "I missed you!... Tap the shiny one!" : "Are you ready to learn?... Let's go! Tap the shiny one!", { remember: true });
  } catch (e) {}
});
// every phrase Miss Bloom can say (for voice-tools/make_voice.py). Keep in sync when adding new say() lines.
function allLines() {
  const out = [];
  const add = (...t) => out.push(...t);
  add(...PRAISE, "Hi friend! I'm Miss Bloom!", 'Butterfly!', "Let's finish the shiny one first!", 'Where shall we go next?', 'Tap the shiny one!',
    "Let's play again!", "Ooh, look!... Let's listen and point!", "Look!... Let's point and say!", 'Now you!... Tap and listen!',
    'Wow! Yay! Yes! I heard you! Great talking!', 'Oops! Try again!', "Let's try again!", 'Look! Your caterpillar is a butterfly now!',
    'I missed you!... Tap the shiny one!', "Are you ready to learn?... Let's go! Tap the shiny one!",
    "Hi friend!... Let's add!... Count with me!", "Hi friend!... Let's take away!... Count with me!", 'Catch the answer!', 'Say it!');
  for (const id of Object.keys(WORDS)) {
    const n = W(id).name;
    add(P.intro(id), P.ask(id), P.that(id), P.catch(id), P.got(id), `Tap the ${n}!`, cap(n) + '!', `Can you point to the ${n}?... Tap it!`,
      `Can you say ${n}?... ${cap(n)}.`, `${cap(n)}! Good talking!`);
  }
  for (const L of LESSONS) {
    add(`Hi friend!... Today we're learning... ${L.title}! Let's go!`, `Yay! You did it!... You finished ${L.title}! Here's your sticker!`);
    if (L.type !== 'math') continue;
    const T = L.thing, plus = L.op === '+', opWord = plus ? 'plus' : 'take away';
    for (let a = 1; a <= 5; a++) for (let b = 1; b <= 5; b++) {
      const r = plus ? a + b : a - b; if (r < 1 || r > 5) continue;
      const sent = `${cap(NUM[a])} ${opWord} ${NUM[b]} is ${NUM[r]}.`, q = `${cap(NUM[a])} ${opWord} ${NUM[b]} is...?`;
      add(`${cap(NUM[a])} ${plural(a, T)}.`, plus ? `Plus ${NUM[b]} ${plural(b, T)}.` : `Take away ${NUM[b]}.`, `${cap(NUM[r])} ${plural(r, T)}! ${sent}`,
        q, `Hmm, let's count again! ${q}`, `${cap(NUM[a])} ${opWord} ${NUM[b]}... Catch the answer!`, `${q} Say it!`, `${cap(NUM[r])}! ${sent}`);
    }
    for (let n = 1; n <= 5; n++) add(`That's ${NUM[n]}. Let's count again!`);
  }
  return [...new Set(out.flatMap(splitParts))];
}
// test hook (used by the automatic checker only)
window.__lwg = { LESSONS, runLesson, showMap, allLines, get stats() { return stats; }, get clips() { return CLIPS ? CLIPS.size : 0; } };
})();
