<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Little Word Garden</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#f3eee3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Word Garden">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2a22; --cream:#fff8ee; --orange:#e9742b; --blue:#3f8fd6; --green:#3f8445; --red:#d9452b;
  --teacher-h: clamp(170px, 36vh, 330px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3eee3;color:var(--ink);
  font-family:'Baloo 2',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#scene{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#f4efe4 0%,#f2eee3 38%,#dcecec 70%,#bfe2ea 100%)}
#scene::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(120,100,80,.05) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(120,100,80,.035) 0 1px,transparent 1px 4px)}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .3 0 0 0 .45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#decor{position:absolute;inset:0;pointer-events:none;z-index:1}
.foliage{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.foliage svg{width:100%;height:100%;display:block}
#foliageBack{height:30vh;z-index:1}
#foliageFront{height:17vh;z-index:4}

/* teacher */
#teacher{position:absolute;left:max(8px,1.5vw);bottom:1.5vh;height:var(--teacher-h);aspect-ratio:220/300;z-index:3;
  animation:float 3.2s ease-in-out infinite}
#teacher svg{width:100%;height:100%;display:block;overflow:visible}
#teacher.cheer{animation:jump .7s ease-out}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes jump{0%{transform:none}30%{transform:translateY(-34px) rotate(-4deg)}60%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
#bubble{position:absolute;left:calc(var(--teacher-h) * .62 + 1.5vw);bottom:calc(var(--teacher-h) * .72);z-index:9;
  max-width:min(62vw,380px);background:#fff;border-radius:26px;padding:12px 22px;font-size:clamp(22px,3.6vh,32px);
  font-weight:800;line-height:1.15;box-shadow:0 6px 0 rgba(59,42,34,.12),0 10px 30px rgba(59,42,34,.12);
  transform-origin:0 100%;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;opacity:0;transform:scale(.6)}
#bubble.show{opacity:1;transform:scale(1)}
#bubble::after{content:"";position:absolute;left:-12px;bottom:14px;border:12px solid transparent;border-right-color:#fff;border-left:0}

/* bugs */
#bugs{position:absolute;inset:0;z-index:5;pointer-events:none}
.bug{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;will-change:transform}
.bug .flip,.bug .wig{width:100%}
.bug svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 3px rgba(59,42,34,.15))}
.bug::before{content:"";position:absolute;inset:-18%;border-radius:50%}/* bigger tap target */
.wig.go{animation:wiggle .6s}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.15)}40%{transform:rotate(12deg) scale(1.15)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.bug.spot::after{content:"";position:absolute;inset:-30%;border-radius:50%;pointer-events:none;
  border:5px dashed #ffd23f;animation:spin 6s linear infinite, glow 1s ease-in-out infinite alternate}
@keyframes spin{to{rotate:360deg}}
@keyframes glow{to{box-shadow:0 0 0 10px rgba(255,210,63,.25)}}

/* UI */
#ui{position:absolute;inset:0;z-index:10;pointer-events:none}
#ui > *{pointer-events:auto}
.modes{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;display:flex;gap:12px}
.mode{width:clamp(68px,10vh,88px);border:0;border-radius:26px;padding:8px 4px 6px;background:var(--cream);
  box-shadow:0 6px 0 rgba(59,42,34,.18);cursor:pointer;font:inherit;color:var(--ink);transition:transform .1s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(59,42,34,.18)}
.mode:disabled{opacity:.45}
.mode .ic{display:grid;place-items:center;width:clamp(44px,6.5vh,58px);height:clamp(44px,6.5vh,58px);margin:0 auto;border-radius:50%}
.mode .ic svg{width:62%;height:62%}
.mode b{display:block;font-size:13px;line-height:1.2;margin-top:4px}
#btnTalk .ic{background:var(--orange)}
#btnCatch .ic{background:var(--blue)}
#pet{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;background:var(--cream);border-radius:24px;
  padding:8px 12px 10px;box-shadow:0 6px 0 rgba(59,42,34,.18);text-align:center;width:clamp(104px,15vh,130px)}
#petArt{height:clamp(46px,7vh,62px);display:grid;place-items:center}
#petArt > div{height:100%;aspect-ratio:1.6;display:grid;place-items:center;transition:transform .4s}
#petArt svg{max-width:100%;max-height:100%}
#petArt.shake > div{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#petDots{display:flex;gap:5px;justify-content:center;margin-top:6px}
#petDots i{width:12px;height:12px;border-radius:50%;background:#e7dccb}
#petDots i.on{background:#8cc63e;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
#stickers{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;
  background:rgba(255,248,238,.85);padding:6px 10px;border-radius:20px;box-shadow:0 4px 0 rgba(59,42,34,.12)}
#stickers div{width:clamp(34px,5vh,44px);height:clamp(34px,5vh,44px);display:grid;place-items:center;border-radius:12px;
  background:#fff;filter:grayscale(1);opacity:.35;transition:.3s}
#stickers div.on{filter:none;opacity:1}
#stickers div.pop{animation:pop .6s}
#stickers svg{width:84%;height:84%}
@keyframes pop{40%{transform:scale(1.5) rotate(-10deg)}}
@media (max-width:720px){#stickers{top:calc(max(12px,env(safe-area-inset-top)) + clamp(96px,14vh,118px))}}

/* listening + choices */
#listen{position:absolute;right:6vw;bottom:6vh;display:none;flex-direction:column;align-items:center;gap:10px}
#listen.show{display:flex}
#mic{width:96px;height:96px;border-radius:50%;background:var(--red);display:grid;place-items:center;position:relative;
  box-shadow:0 6px 0 rgba(0,0,0,.18)}
#mic svg{width:46px;height:46px}
#mic::before,#mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--red);animation:ring 1.4s infinite}
#mic::after{animation-delay:.7s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
#listen .say{font-size:26px;font-weight:800;background:#fff;padding:2px 18px;border-radius:16px}
#toTap{border:0;border-radius:16px;background:var(--cream);font:inherit;font-size:15px;padding:6px 14px;cursor:pointer;
  box-shadow:0 3px 0 rgba(59,42,34,.15);color:var(--ink)}
#choices{position:absolute;right:3vw;bottom:3vh;display:none;gap:14px;z-index:2}
@media (max-width:720px){#choices{right:50%;transform:translateX(50%);bottom:auto;top:38vh}}
#choices.show{display:flex}
.card{border:0;border-radius:24px;background:#fff;width:clamp(92px,15vh,130px);padding:10px 8px 6px;cursor:pointer;
  box-shadow:0 6px 0 rgba(59,42,34,.16);font:inherit;font-size:20px;font-weight:800;color:var(--ink);animation:in .35s backwards}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card .pic{height:clamp(56px,9vh,80px);display:grid;place-items:center}
.card .pic svg{max-width:100%;max-height:100%}
.card .dot{width:70%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
@keyframes in{from{transform:translateY(40px);opacity:0}}
#toast{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;
  border-radius:14px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:.92}

/* fx */
.fx{position:absolute;z-index:8;pointer-events:none}
.spark{font-size:26px;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(160deg);opacity:0}}
.netfx{width:110px;animation:swoop .7s ease-in-out forwards}
@keyframes swoop{0%{transform:translate(60px,-80px) rotate(40deg);opacity:0}40%{opacity:1}70%{transform:translate(0,0) rotate(-20deg)}100%{transform:translate(-10px,10px) rotate(-30deg);opacity:0}}
#flowerBed .grow{animation:grow .9s cubic-bezier(.3,1.5,.5,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{transform:scale(0)}}

/* start */
#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(243,238,227,.7);backdrop-filter:blur(3px)}
#start .box{text-align:center;padding:24px}
#start h1{font-size:clamp(40px,8vh,72px);margin:0;line-height:1;color:var(--green);text-shadow:0 4px 0 #fff}
#start p{margin:6px 0 22px;font-size:20px}
#play{width:130px;height:130px;border-radius:50%;border:0;background:var(--orange);cursor:pointer;
  box-shadow:0 8px 0 #b9541a;animation:breathe 1.6s ease-in-out infinite}
#play svg{width:56px;height:56px;margin-left:8px}
@keyframes breathe{50%{transform:scale(1.07)}}
#start small{display:block;margin-top:22px;opacity:.7;font-size:14px}
</style>
</head>
<body>
<div id="scene">
  <div id="decor"></div>
  <div id="foliageBack" class="foliage"></div>
  <div id="teacher"></div>
  <div id="foliageFront" class="foliage"></div>
  <div id="bugs"></div>
  <div id="bubble"></div>
  <div id="ui">
    <div class="modes">
      <button class="mode" id="btnTalk" aria-label="Talk with Miss Bloom">
        <span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 17v4M9 21h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>
        <b>Nói chuyện</b>
      </button>
      <button class="mode" id="btnCatch" aria-label="Catch the butterfly">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="6" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="2"/><path d="M5 9h8M9 5v8M6 6l6 6M12 6l-6 6" stroke="#fff" stroke-width=".8"/><path d="M13.5 13.5L21 21" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
        <b>Bắt bướm</b>
      </button>
    </div>
    <div id="stickers"></div>
    <div id="pet" aria-label="My caterpillar"><div id="petArt"><div></div></div><div id="petDots"></div></div>
    <div id="listen">
      <div id="mic"><svg viewBox="0 0 24 24" fill="#fff"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 17v4" stroke="#fff" stroke-width="2"/></svg></div>
      <div class="say">Say it!</div>
      <button id="toTap">👆 Chạm để chọn</button>
    </div>
    <div id="choices"></div>
    <div id="toast"></div>
  </div>
</div>
<div id="start"><div class="box">
  <h1>Little Word Garden</h1>
  <p>Vườn từ vựng của bé 🌱</p>
  <button id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg></button>
  <small>Bố mẹ: mở bằng Chrome và cho phép micro để bé nói chuyện với cô.</small>
</div></div>

<script src="art.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s[0].toUpperCase() + s.slice(1);
const wait = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem('lwg_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lwg_' + k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- content ---------- */
const INSECTS = {
  butterfly:   { size: 96,  fly: true,  aliases: ['butterfly', 'butter fly', 'butterflies', 'butterfl', 'butter'] },
  bee:         { size: 74,  fly: true,  aliases: ['bee', 'bees', 'be', 'b', 'bea', 'bi', 'beat', 'been', 'beep'] },
  ladybug:     { size: 70,  fly: false, aliases: ['ladybug', 'lady bug', 'ladybird', 'lady bird', 'ladybugs', 'lady'] },
  snail:       { size: 88,  fly: false, aliases: ['snail', 'snails', 'nail', 'sneil', 'snell', 'snake'] },
  caterpillar: { size: 104, fly: false, aliases: ['caterpillar', 'cater pillar', 'catapillar', 'caterpillars', 'pillar', 'cat'] },
  dragonfly:   { size: 112, fly: true,  aliases: ['dragonfly', 'dragon fly', 'dragon', 'dragonflies'] },
};
const KINDS = Object.keys(INSECTS);
const COLORS = { red: '#ec4b3c', yellow: '#f6c12a', blue: '#4b9be3', pink: '#f383b0', purple: '#9b6bd6', orange: '#f28a2b' };
const COLOR_ALIASES = {
  red: ['red', 'read', 'rad', 'bread', 'wed', 'rat'], yellow: ['yellow', 'yello', 'jello', 'yell', 'hello'],
  blue: ['blue', 'blew', 'blu', 'glue', 'boo'], pink: ['pink', 'ping', 'pinky', 'pig'],
  purple: ['purple', 'pupil', 'pupple', 'apple'], orange: ['orange', 'orang', 'ornge', 'oranges'],
};
const PRAISE = ['Great job!', 'Yes! Super!', 'Wonderful!', 'Hooray!', 'You did it!', 'Excellent!'];

/* ---------- build scene ---------- */
const style = document.createElement('style'); style.textContent = ART.css || ''; document.head.appendChild(style);
$('#decor').innerHTML = ART.decor();
$('#foliageBack').innerHTML = ART.foliageBack();
$('#foliageFront').innerHTML = ART.foliageFront();
const teacher = $('#teacher'); teacher.innerHTML = ART.teacher();
const bubble = $('#bubble');

/* ---------- speech out ---------- */
let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const pref = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Ava', 'Microsoft Zira', 'Karen', 'Tessa', 'Google UK English Female'];
  for (const p of pref) { const v = vs.find(v => v.name.includes(p)); if (v) { voice = v; return; } }
  voice = vs.find(v => /female/i.test(v.name)) || vs.find(v => v.lang === 'en-US') || vs[0] || null;
}
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }

let sayToken = 0, bubbleTimer = 0;
function say(text, { rate = 0.85, pitch = 1.25 } = {}) {
  return new Promise(resolve => {
    const my = ++sayToken;
    clearTimeout(bubbleTimer);
    bubble.textContent = text; bubble.classList.add('show');
    teacher.classList.add('talking');
    let timer = 0;
    const done = () => {
      clearTimeout(timer);
      if (my === sayToken) {
        teacher.classList.remove('talking');
        bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 3500);
      }
      resolve();
    };
    if (!('speechSynthesis' in window)) { timer = setTimeout(done, 700 + text.length * 70); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = rate; u.pitch = pitch;
    u.onend = done; u.onerror = done;
    timer = setTimeout(done, 2500 + text.length * 120); // safety net
    setTimeout(() => speechSynthesis.speak(u), 40);
  });
}

/* ---------- speech in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOK = !!SR;
let cancelListen = null;
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 4000); };

function listenOnce(ms = 7000) {
  return new Promise(resolve => {
    if (!micOK) return resolve({ error: 'nosr' });
    let finished = false; const alts = []; const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
    const finish = r => {
      if (finished) return; finished = true; clearTimeout(t); cancelListen = null;
      $('#listen').classList.remove('show'); teacher.classList.remove('listening');
      try { rec.abort(); } catch (e) {}
      resolve(r);
    };
    rec.onresult = e => { for (const r of e.results) for (let i = 0; i < r.length; i++) alts.push(r[i].transcript); finish({ alts }); };
    rec.onerror = e => finish({ error: e.error, alts });
    rec.onend = () => finish({ alts });
    const t = setTimeout(() => finish({ alts }), ms);
    cancelListen = () => finish({ switch: true });
    $('#listen').classList.add('show'); teacher.classList.add('listening');
    try { rec.start(); } catch (e) { finish({ error: 'start' }); }
  });
}
$('#toTap').addEventListener('click', () => cancelListen && cancelListen());

function chooseCards(options) {
  return new Promise(resolve => {
    const box = $('#choices'); box.innerHTML = '';
    for (const o of [...options].sort(() => Math.random() - .5)) {
      const b = document.createElement('button'); b.className = 'card';
      b.innerHTML = `<div class="pic">${o.pic}</div>${o.label}`;
      b.onclick = () => { box.classList.remove('show'); box.innerHTML = ''; resolve([o.value]); };
      box.appendChild(b);
    }
    box.classList.add('show');
  });
}

const norm = s => s.toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return Math.max(m, n);
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const sim = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length);
function isMatch(alts, aliases) {
  for (const a of alts || []) {
    const n = norm(a); if (!n) continue;
    const words = n.split(' '), joined = n.replace(/ /g, '');
    for (const al of aliases) {
      const an = norm(al), aj = an.replace(/ /g, '');
      if (aj.length <= 2) { if (words.includes(an)) return true; continue; }
      if ((' ' + n + ' ').includes(' ' + an + ' ') || joined.includes(aj)) return true;
      if (aj.length >= 5 && sim(joined, aj) >= 0.6) return true;
      if (aj.length >= 4 && words.some(w => sim(w, aj) >= 0.7)) return true;
    }
  }
  return false;
}

// Ask a question: up to 2 tries; mic first, picture cards as fallback.
async function ask(aliases, options, hint) {
  for (let attempt = 0; attempt < 2; attempt++) {
    let ans;
    if (micOK) {
      const r = await listenOnce();
      if (['not-allowed', 'service-not-allowed', 'nosr', 'start', 'network', 'audio-capture'].includes(r.error)) {
        micOK = false;
        toast('Chưa dùng được micro – bé chạm vào hình để trả lời nhé');
        ans = await chooseCards(options);
      } else if (r.switch) ans = await chooseCards(options);
      else ans = r.alts;
    } else ans = await chooseCards(options);
    if (isMatch(ans, aliases)) return true;
    if (attempt === 0) await say(hint);
  }
  return false;
}

/* ---------- bugs ---------- */
const bugLayer = $('#bugs');
const bugs = [];
const scaleK = () => Math.max(0.7, Math.min(1.25, Math.min(innerWidth, innerHeight * 1.4) / 900));
function bounds(b) {
  const W = innerWidth, H = innerHeight, w = b.el.offsetWidth || 80, h = b.el.offsetHeight || 60;
  if (b.fly) return { x0: W * 0.04, x1: W * 0.96 - w, y0: H * 0.16, y1: H * 0.62 - h };
  const left = Math.min(W * 0.5, teacher.offsetWidth + 30);
  return { x0: left, x1: W * 0.97 - w, y0: H * 0.985 - h - H * 0.06, y1: H * 0.985 - h };
}
function newTarget(b) {
  const r = bounds(b);
  b.tx = rand(r.x0, Math.max(r.x0 + 1, r.x1)); b.ty = rand(r.y0, Math.max(r.y0 + 1, r.y1));
}
function makeBug(kind, color, at) {
  const info = INSECTS[kind];
  const el = document.createElement('div'); el.className = 'bug ' + kind;
  el.innerHTML = `<div class="flip"><div class="wig">${ART.bug(kind, COLORS[color] || color)}</div></div>`;
  el.style.width = info.size * scaleK() + 'px';
  bugLayer.appendChild(el);
  const b = { kind, color, el, flip: el.firstChild, wig: el.firstChild.firstChild, fly: info.fly,
    speed: info.fly ? rand(45, 80) : rand(14, 24), phase: rand(0, 6.28), dir: 1, paused: false, x: 0, y: 0 };
  const r = bounds(b);
  if (at) { b.x = at.x; b.y = at.y; } else { b.x = rand(r.x0, r.x1); b.y = rand(r.y0, r.y1); }
  newTarget(b);
  el.addEventListener('pointerdown', e => { e.preventDefault(); onBugTap(b); });
  bugs.push(b);
  return b;
}
function removeBug(b) { b.el.remove(); bugs.splice(bugs.indexOf(b), 1); }

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const b of bugs) {
    if (!b.paused) {
      const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
      if (d < 6) newTarget(b);
      else { b.x += dx / d * b.speed * dt; b.y += dy / d * b.speed * dt; if (Math.abs(dx) > 3) b.dir = dx < 0 ? -1 : 1; }
    }
    b.phase += dt * (b.fly ? 3 : 1.5);
    const bob = b.fly ? Math.sin(b.phase) * 8 : 0;
    b.el.style.transform = `translate(${b.x}px,${b.y + bob}px)`;
    b.flip.style.transform = b.kind === 'butterfly' ? '' : `scaleX(${b.dir})`;
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', () => bugs.forEach(b => {
  b.el.style.width = INSECTS[b.kind].size * scaleK() + 'px';
  const r = bounds(b); b.x = Math.min(Math.max(b.x, r.x0), r.x1); b.y = Math.min(Math.max(b.y, r.y0), r.y1); newTarget(b);
}));

function wiggle(b) { b.wig.classList.remove('go'); void b.wig.offsetWidth; b.wig.classList.add('go'); }
function centerOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function sparkle(x, y, n = 10) {
  const chars = ['✦', '★', '✿', '❀', '•'], cols = ['#ffd23f', '#f383b0', '#8cc63e', '#4b9be3', '#f28a2b'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'fx spark'; s.textContent = pick(chars);
    s.style.left = x - 12 + 'px'; s.style.top = y - 16 + 'px'; s.style.color = pick(cols);
    const a = rand(0, 6.28), d = rand(50, 110);
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}
const article = w => (/^[aeiou]/.test(w) ? 'an' : 'a');
const nameOf = b => b.kind === 'butterfly' ? `a ${b.color} butterfly` : `${article(b.kind)} ${b.kind}`;

/* ---------- stickers & pet & flowers ---------- */
const found = new Set(store.get('found', []));
const stickerEls = {};
for (const k of KINDS) {
  const d = document.createElement('div'); d.title = k;
  d.innerHTML = ART.bug(k, COLORS.yellow); if (found.has(k)) d.classList.add('on');
  $('#stickers').appendChild(d); stickerEls[k] = d;
}
function addSticker(k) {
  if (found.has(k)) return;
  found.add(k); store.set('found', [...found]);
  const d = stickerEls[k]; d.classList.add('on', 'pop'); setTimeout(() => d.classList.remove('pop'), 700);
}

let progress = store.get('progress', 0);
const PET_MAX = 6;
for (let i = 0; i < PET_MAX; i++) $('#petDots').appendChild(document.createElement('i'));
function renderPet() {
  const box = $('#petArt').firstChild;
  if (progress < 3) { box.innerHTML = ART.bug('caterpillar'); box.style.transform = `scale(${0.7 + progress * 0.15})`; }
  else { box.innerHTML = ART.cocoon(); box.style.transform = ''; }
  $('#petArt').classList.toggle('shake', progress >= 5);
  [...$('#petDots').children].forEach((d, i) => d.classList.toggle('on', i < progress));
}
async function grow() {
  progress++; renderPet(); store.set('progress', progress);
  if (progress < PET_MAX) return;
  // metamorphosis!
  const c = centerOf($('#petArt'));
  sparkle(c.x, c.y, 18);
  const color = pick(Object.keys(COLORS));
  const bf = makeBug('butterfly', color, { x: c.x - 48, y: c.y });
  wiggle(bf); cheer();
  progress = 0; store.set('progress', 0); renderPet();
  trimButterflies();
  await say(`Wow! Your caterpillar is a ${color} butterfly now!`);
}
function trimButterflies() {
  const bfs = bugs.filter(b => b.kind === 'butterfly' && !b.paused);
  while (bfs.length > 7) removeBug(bfs.shift());
}
let flowers = store.get('flowers', []);
function drawFlower(f, animate) {
  const bed = document.getElementById('flowerBed'); if (!bed) return;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${f.x} ${f.y}) scale(${f.s})`);
  g.innerHTML = `<g class="${animate ? 'grow' : ''}">${ART.flower(f.c)}</g>`;
  bed.appendChild(g);
}
function sprout() {
  const f = { x: Math.round(rand(240, 980)), y: Math.round(rand(140, 185)), s: +rand(0.8, 1.15).toFixed(2), c: pick(Object.values(COLORS)) };
  flowers.push(f); if (flowers.length > 24) flowers = flowers.slice(-24);
  store.set('flowers', flowers); drawFlower(f, true);
}
flowers.forEach(f => drawFlower(f, false));

function cheer() { teacher.classList.remove('cheer'); void teacher.offsetWidth; teacher.classList.add('cheer'); setTimeout(() => teacher.classList.remove('cheer'), 800); }

/* ---------- modes ---------- */
let busy = false, mode = 'explore';
const setButtons = on => { $('#btnTalk').disabled = !on; $('#btnCatch').disabled = !on; };

async function onBugTap(b) {
  if (mode === 'catch') return catchTap(b);
  if (busy) return;
  wiggle(b); addSticker(b.kind);
  const c = centerOf(b.el); sparkle(c.x, c.y, 6);
  say(cap(nameOf(b)) + '!');
}

const bugPic = k => ART.bug(k, COLORS.yellow);
function wordOptions(kind) {
  const others = KINDS.filter(k => k !== kind).sort(() => Math.random() - .5).slice(0, 2);
  return [kind, ...others].map(k => ({ value: k, label: k, pic: bugPic(k) }));
}
function colorOptions(color) {
  const others = Object.keys(COLORS).filter(c => c !== color).sort(() => Math.random() - .5).slice(0, 2);
  return [color, ...others].map(c => ({ value: c, label: c, pic: `<div class="dot" style="background:${COLORS[c]}"></div>` }));
}

let lastAsked = null;
async function talkRound() {
  if (busy) return; busy = true; mode = 'talk'; setButtons(false);
  try {
    const pool = bugs.filter(b => b.kind !== lastAsked);
    const b = pick(pool.length ? pool : bugs); lastAsked = b.kind;
    b.paused = true; b.el.classList.add('spot');
    await say(pick(["Look! What's this?", "What's this?", 'Ooh! What is it?']));
    const ok = await ask(INSECTS[b.kind].aliases, wordOptions(b.kind), `Listen... ${b.kind}! Now you say it!`);
    addSticker(b.kind);
    if (ok) {
      cheer(); const c = centerOf(b.el); sparkle(c.x, c.y, 14); sprout();
      await say(`${pick(PRAISE)} ${cap(b.kind)}!`);
      await grow();
      if (b.kind === 'butterfly') {
        await say('What color is it?');
        const ok2 = await ask(COLOR_ALIASES[b.color], colorOptions(b.color), `It's ${b.color}. Say... ${b.color}!`);
        if (ok2) { cheer(); sprout(); await say(`Yes! A ${b.color} butterfly!`); await grow(); }
        else await say(`${cap(b.color)}! A ${b.color} butterfly. Good try!`);
      }
    } else {
      await say(`It's ${nameOf(b)}! Good try!`);
    }
    b.paused = false; b.el.classList.remove('spot'); newTarget(b);
  } finally { busy = false; mode = 'explore'; setButtons(true); }
}

let catchTarget = null, catchDone = null, catchLock = false;
async function catchRound() {
  if (busy) return; busy = true; setButtons(false);
  let colors = [...new Set(bugs.filter(b => b.kind === 'butterfly').map(b => b.color))];
  const spare = Object.keys(COLORS).filter(c => !colors.includes(c));
  while (colors.length < 3 && spare.length) { const c = spare.splice(Math.floor(Math.random() * spare.length), 1)[0]; makeBug('butterfly', c); colors.push(c); }
  trimButterflies();
  colors = [...new Set(bugs.filter(b => b.kind === 'butterfly').map(b => b.color))];
  catchTarget = pick(colors);
  await say(`Catch the ${catchTarget} butterfly!`);
  mode = 'catch';
  await new Promise(r => (catchDone = r));
  mode = 'explore'; busy = false; setButtons(true);
}
async function catchTap(b) {
  if (catchLock) return; catchLock = true;
  if (b.kind === 'butterfly' && b.color === catchTarget) {
    const c = centerOf(b.el);
    const net = document.createElement('div'); net.className = 'fx netfx'; net.innerHTML = ART.net();
    net.style.left = c.x - 55 + 'px'; net.style.top = c.y - 70 + 'px'; document.body.appendChild(net);
    setTimeout(() => net.remove(), 800);
    b.paused = true; wiggle(b);
    await wait(450); sparkle(c.x, c.y, 16); cheer(); sprout();
    await say(`You got it! A ${b.color} butterfly!`);
    b.paused = false; newTarget(b);
    await grow();
    catchLock = false; catchDone && catchDone();
  } else {
    wiggle(b);
    await say(`That's ${nameOf(b)}. Find the ${catchTarget} butterfly!`);
    catchLock = false;
  }
}

$('#btnTalk').addEventListener('click', talkRound);
$('#btnCatch').addEventListener('click', catchRound);

/* ---------- start ---------- */
for (const c of ['yellow', 'blue', 'pink']) makeBug('butterfly', c);
renderPet();
requestAnimationFrame(tick);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

$('#play').addEventListener('click', async () => {
  $('#start').remove();
  pickVoice();
  for (const k of ['bee', 'ladybug', 'snail', 'caterpillar', 'dragonfly']) makeBug(k);
  await say("Hi! I'm Miss Bloom!");
  await say("Let's play in the garden!");
});
})();
</script>
